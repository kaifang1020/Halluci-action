# v2 sweep — re-run all 56 tasks across these agent/model pairs.
# Add a row to grow the sweep; no script edits needed.
# Consumed by scripts/sweep_pairs.py and driven by run_experiment_v2.sh.

defaults:
  kl: KL1
  runs: 1
  mode: all          # independent + dependent chains
  max_steps: 15

agents:
  - provider: deepseek
    model: deepseek-chat
  - provider: deepseek
    model: deepseek-reasoner
  - provider: openai
    model: gpt-4o
