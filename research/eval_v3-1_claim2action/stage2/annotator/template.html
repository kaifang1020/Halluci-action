<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stage 2 Claim Verification</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e6e8ee;
  --accent:#4f46e5; --accent-soft:#eef0ff;
  --ok:#0f9d58; --ok-soft:#e7f6ee; --bad:#d93025; --bad-soft:#fce8e6;
  --warn:#b8860b; --warn-soft:#fdf3dc;
  --code-bg:#f3f4f8; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
header{
  height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
header .brand{font-weight:700;letter-spacing:.2px}
header .chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:600}
header .spacer{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.progress .bar{width:160px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress .bar > i{display:block;height:100%;background:var(--accent);width:0%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;
  font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#c9cdd8}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.annot-name{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;width:140px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:282px minmax(420px,1fr) 380px;height:calc(100vh - 54px)}
.col{overflow-y:auto;height:100%}
.col.nav{border-right:1px solid var(--line);background:var(--panel)}
.col.main{padding:20px 24px}
.col.ctx{border-left:1px solid var(--line);background:var(--panel)}

/* ---------- nav ---------- */
.nav .search{position:sticky;top:0;background:var(--panel);padding:12px;border-bottom:1px solid var(--line);z-index:5}
.nav .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.filters button{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-weight:600}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step-group{padding:6px 0}
.step-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;padding:8px 14px 4px}
.claim-item{display:flex;gap:9px;align-items:flex-start;padding:9px 14px;border-left:3px solid transparent;
  cursor:pointer}
.claim-item:hover{background:#fafbfe}
.claim-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--line);border:1px solid #d2d6e0}
.dot.supported{background:var(--ok);border-color:var(--ok)}
.dot.not_supported{background:var(--bad);border-color:var(--bad)}
.dot.needs_broader_context{background:var(--warn);border-color:var(--warn)}
.claim-meta{min-width:0}
.claim-id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.claim-span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- type badges ---------- */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.t-action_intention{background:#e8f0fe;color:#1a56db}
.t-action_completion{background:#e7f6ee;color:#0f7a43}
.t-observation{background:#fef3e2;color:#b45309}
.t-constraint_or_policy{background:#f3e8fd;color:#7c3aed}

/* ---------- main claim card ---------- */
.task-banner{background:linear-gradient(180deg,#fbfcff,#f5f6fb);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;margin-bottom:16px}
.task-banner .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.task-banner .task{margin-top:4px;font-size:14px}
.task-banner .dt{margin-top:6px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.claim-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;box-shadow:var(--shadow)}
.claim-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.claim-head .claim-id{font-size:12px}
.span-quote{font-size:18px;line-height:1.45;font-weight:600;border-left:4px solid var(--accent);
  padding:6px 0 6px 14px;margin:6px 0 14px}
.scope-line{font-size:12px;color:var(--muted);margin-bottom:4px}
.scope-line code{font-family:var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px}

.section{margin-top:18px}
.section > h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.section .hint{font-weight:500;text-transform:none;letter-spacing:0;color:#9aa1ad;font-size:11px}

/* ---------- evidence rendering ---------- */
.ev-channel{margin-bottom:12px}
.ev-channel .ev-title{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:6px}
.ev-empty{color:#9aa1ad;font-style:italic;font-size:12.5px}
.callcard{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#fcfcfe}
.callcard .ch{font-size:11px;color:var(--muted);font-family:var(--mono)}
.callcard .sig{font-family:var(--mono);font-size:12.5px;margin-top:2px;word-break:break-word}
.callcard .sig b{color:var(--accent)}
.result-toggle{font-size:11px;color:var(--accent);background:none;border:none;padding:4px 0;font-weight:600}
.jsonbox{background:var(--code-bg);border-radius:7px;padding:8px 10px;margin-top:6px;
  font-family:var(--mono);font-size:11.5px;overflow-x:auto;max-height:320px;overflow-y:auto}
.j-key{color:#7c3aed}.j-str{color:#0f7a43}.j-num{color:#1a56db}.j-bool{color:#b45309}.j-null{color:#9aa1ad}
.j-tog{cursor:pointer;user-select:none;color:#9aa1ad}
.j-tog:hover{color:var(--ink)}
.j-children{margin-left:14px;border-left:1px dotted #d8dbe4;padding-left:8px}
.j-collapsed > .j-children{display:none}
.j-collapsed > .j-tog::after{content:" …"}
.match{background:#fff3bf;border-radius:3px;padding:0 2px}

/* ---------- annotation form ---------- */
.verdict-row{display:flex;gap:10px;margin-bottom:14px}
.verdict-btn{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 8px;background:var(--panel);
  font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.verdict-btn .k{font-size:10px;color:var(--muted);font-weight:600}
.verdict-btn:hover{border-color:#c9cdd8}
.verdict-btn.sel.supported{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict-btn.sel.not_supported{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.verdict-btn.sel.needs_broader_context{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13px;font-family:inherit;background:var(--panel)}
.field textarea{resize:vertical;min-height:58px}
.pointer-grid{display:grid;grid-template-columns:1.2fr .6fr 2fr;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags button{font-size:11px;padding:3px 9px;border-radius:999px;border:1px dashed #cdd1db;
  background:#fafbfe;color:var(--muted);font-weight:600}
.tags button:hover{border-style:solid;color:var(--ink)}
.formnav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.saved-flag{font-size:12px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .3s}
.saved-flag.show{opacity:1}

/* ---------- context column ---------- */
.tabs{display:flex;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.tabs button{flex:1;border:none;background:none;padding:12px 6px;font-size:12px;font-weight:700;
  color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.ctx-body{padding:14px 16px}
.ctx-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px}
.traj-step{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.traj-step.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.traj-step .sh{background:#f7f8fb;padding:6px 10px;font-size:11px;font-weight:700;color:var(--muted)}
.traj-step .sb{padding:9px 11px}
.traj-step .atext{font-size:12.5px;white-space:pre-wrap;margin-bottom:6px}
.tiny{font-size:11px;color:var(--muted);font-family:var(--mono)}
.md h1{font-size:17px;margin:.6em 0 .3em}
.md h2{font-size:15px;margin:1em 0 .3em;border-bottom:1px solid var(--line);padding-bottom:3px}
.md h3{font-size:13px;margin:.8em 0 .2em}
.md p{margin:.4em 0;font-size:12.5px}
.md ul{margin:.3em 0;padding-left:18px;font-size:12.5px}
.md li{margin:.15em 0}
.md code{font-family:var(--mono);background:var(--code-bg);padding:1px 4px;border-radius:4px;font-size:11.5px}
.md strong{color:var(--ink)}
.md hr{border:none;border-top:1px solid var(--line);margin:.8em 0}
.md table{border-collapse:collapse;font-size:11.5px;margin:.4em 0}
.md th,.md td{border:1px solid var(--line);padding:3px 7px;text-align:left}

/* ---------- loader / modal ---------- */
.loader{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px;padding:30px}
.drop{border:2px dashed #c9cdd8;border-radius:14px;padding:40px 50px;text-align:center;background:var(--panel);max-width:520px}
.drop h2{margin:0 0 8px}.drop p{color:var(--muted);margin:6px 0}
.overlay{position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border-radius:14px;max-width:720px;width:92%;max-height:84vh;overflow:auto;
  padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-top:0}
.kbd{font-family:var(--mono);background:var(--code-bg);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>

<div id="loader" class="loader">
  <div class="drop" id="drop">
    <h2>Stage 2 Annotation</h2>
    <p>No data is baked into this file. Drag a <code>*_bundle.json</code> here, or pick one below.</p>
    <p><input type="file" id="filepick" accept="application/json"></p>
    <p class="tiny">If your colleague sent you a single self-contained HTML, just reopen that file — it already has the data inside.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <span class="brand">Stage 2 · Claim Verification</span>
    <span class="chip" id="taskChip">—</span>
    <div class="progress">
      <span id="progText">0 / 0</span>
      <span class="bar"><i id="progBar"></i></span>
    </div>
    <span class="spacer"></span>
    <span class="saved-flag" id="savedFlag">saved ✓</span>
    <input class="annot-name" id="annotName" placeholder="your name">
    <button class="btn" id="btnGuide">📖 Guideline</button>
    <button class="btn" id="btnHelp">⌨︎</button>
    <button class="btn" id="btnImport">Import</button>
    <button class="btn primary" id="btnExport">⬇ Export gold</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </header>

  <div class="layout">
    <!-- NAV -->
    <div class="col nav">
      <div class="search">
        <input id="navSearch" placeholder="Search claims…">
        <div class="filters" id="navFilters">
          <button data-f="all" class="on">All</button>
          <button data-f="todo">To-do</button>
          <button data-f="supported">✓</button>
          <button data-f="not_supported">✗</button>
          <button data-f="needs_broader_context">?</button>
        </div>
      </div>
      <div id="navList"></div>
    </div>

    <!-- MAIN -->
    <div class="col main" id="mainCol">
      <div class="task-banner">
        <div class="lbl">User task</div>
        <div class="task" id="taskText"></div>
        <div class="dt" id="taskDt"></div>
      </div>
      <div class="claim-card" id="claimCard"></div>
    </div>

    <!-- CONTEXT -->
    <div class="col ctx">
      <div class="tabs" id="ctxTabs">
        <button data-tab="trajectory" class="on">Trajectory</button>
        <button data-tab="audit">Audit</button>
        <button data-tab="codebook">Codebook</button>
        <button data-tab="registry">Tools</button>
      </div>
      <div class="ctx-body" id="ctxBody"></div>
    </div>
  </div>
</div>

<script>
/* =======================================================================
   Bundle injection. The build script replaces the next line.
   ======================================================================= */
window.__BUNDLE__ = null; /* __BUNDLE_INJECTION__ */

/* ============================ helpers ================================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHANNELS = ["tool_calls","tool_results","audit","codebook","tool_registry","task_header"];
const VERDICTS = ["supported","not_supported","needs_broader_context"];
const QUICK_TAGS = ["routing_miss","weak_evidence","abandoned_intention","already_retrieved_earlier",
                    "retrieval_gap","normal_result_mismatch","task_header_evidence","design_induced","mis_typed"];

/* tiny markdown renderer (headings/bold/code/lists/hr/tables) */
function mdToHtml(md){
  if(!md) return "";
  const lines = md.replace(/\r/g,"").split("\n");
  let html="", inUl=false, inTbl=false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  const closeUl=()=>{ if(inUl){html+="</ul>";inUl=false;} };
  const closeTbl=()=>{ if(inTbl){html+="</table>";inTbl=false;} };
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)){
      const cells=l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue; // separator row
      if(!inTbl){closeUl();html+="<table>";inTbl=true;}
      html+="<tr>"+cells.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
      continue;
    } else closeTbl();
    if(/^#{1,6}\s/.test(l)){closeUl();const n=l.match(/^#+/)[0].length;html+=`<h${n}>${inline(l.replace(/^#+\s/,""))}</h${n}>`;}
    else if(/^\s*[-*]\s+/.test(l)){ if(!inUl){html+="<ul>";inUl=true;} html+="<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>"; }
    else if(/^\s*---+\s*$/.test(l)){closeUl();html+="<hr>";}
    else if(l.trim()===""){closeUl();}
    else {closeUl();html+="<p>"+inline(l)+"</p>";}
  }
  closeUl();closeTbl();
  return html;
}

/* collapsible JSON renderer with optional highlight terms */
function renderJSON(value, terms){
  const wrap=document.createElement("div");
  wrap.className="jsonbox";
  wrap.appendChild(node(value,0));
  return wrap;
  function hl(s){ s=esc(s); if(terms&&terms.length){ for(const t of terms){ if(t&&t.length>=2){
        try{ s=s.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),'<span class="match">$1</span>'); }catch(e){}
  }}} return s; }
  function leaf(v){
    const s=document.createElement("span");
    if(v===null){s.className="j-null";s.textContent="null";}
    else if(typeof v==="string"){s.className="j-str";s.innerHTML='"'+hl(v)+'"';}
    else if(typeof v==="number"){s.className="j-num";s.textContent=v;}
    else if(typeof v==="boolean"){s.className="j-bool";s.textContent=v;}
    else s.textContent=String(v);
    return s;
  }
  function node(v,depth){
    if(v===null||typeof v!=="object") return leaf(v);
    const isArr=Array.isArray(v);
    const entries=isArr?v.map((x,i)=>[i,x]):Object.entries(v);
    const box=document.createElement("div");
    if(entries.length===0){ box.appendChild(leaf(isArr?"[]":"{}")); return box; }
    const tog=document.createElement("span");
    tog.className="j-tog"; tog.textContent=(isArr?"["+entries.length+"]":"{"+entries.length+"}");
    tog.onclick=()=>box.classList.toggle("j-collapsed");
    box.appendChild(tog);
    const ch=document.createElement("div"); ch.className="j-children";
    for(const [k,val] of entries){
      const row=document.createElement("div");
      const key=document.createElement("span"); key.className="j-key"; key.textContent=(isArr?k:'"'+k+'"')+": ";
      row.appendChild(key); row.appendChild(node(val,depth+1)); ch.appendChild(row);
    }
    box.appendChild(ch);
    if(depth>=2) box.classList.add("j-collapsed");
    return box;
  }
}

function sig(call){
  const p=call.parameters||{};
  const args=Object.entries(p).map(([k,v])=>`${k}=${typeof v==="string"?JSON.stringify(v):JSON.stringify(v)}`).join(", ");
  return `${call.tool_name}(${args})`;
}

/* ============================ state =================================== */
let B=null;            // bundle
let claims=[];         // claim list
let ann={};            // claim_id -> {verdict, evidence_pointer:{channel,step,ref}, reason, notes}
let curId=null;
let filter="all";
let lsKey="stage2ann::";

/* scope windowing mirrors preprocess._in_scope */
function inScope(itemStep, claimStep, scope){
  if(scope==="same_or_following_steps") return itemStep>=claimStep;
  if(scope==="same_or_previous_steps")  return itemStep<=claimStep;
  if(scope==="previous_steps")          return itemStep< claimStep;
  if(scope==="same_step")               return itemStep===claimStep;
  return true;
}

/* ============================ boot ==================================== */
function boot(bundle){
  B=bundle; claims=B.claims||[];
  lsKey="stage2ann::"+(B.task_id||"task")+"::"+(B.trajectory_file||"");
  loadLocal();
  $("#loader").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#taskChip").textContent=B.task_id||"—";
  $("#taskText").textContent=(B.task_header&&B.task_header.task)||B.task||"";
  $("#taskDt").textContent="current_datetime: "+((B.task_header&&B.task_header.current_datetime)||"—");
  $("#annotName").value=ann.__meta__&&ann.__meta__.annotator||"";
  buildNav(); selectClaim(curId||(claims[0]&&claims[0].claim_id));
  switchTab("trajectory");
  bindGlobal();
}

/* ---------------- persistence ---------------- */
function loadLocal(){ try{ const r=localStorage.getItem(lsKey); if(r) ann=JSON.parse(r);}catch(e){} if(!ann.__meta__) ann.__meta__={}; }
let saveTimer=null;
function save(){
  ann.__meta__.annotator=$("#annotName").value.trim();
  try{ localStorage.setItem(lsKey, JSON.stringify(ann)); }catch(e){}
  const f=$("#savedFlag"); f.classList.add("show"); clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>f.classList.remove("show"),900);
  updateProgress();
}

/* ---------------- nav ---------------- */
function statusOf(id){ const a=ann[id]; return a&&a.verdict?a.verdict:""; }
function buildNav(){
  const q=$("#navSearch").value.toLowerCase();
  const list=$("#navList"); list.innerHTML="";
  let lastStep=null;
  claims.forEach(c=>{
    const st=statusOf(c.claim_id);
    if(filter==="todo" && st) return;
    if(["supported","not_supported","needs_broader_context"].includes(filter) && st!==filter) return;
    if(q && !(c.claim_id.toLowerCase().includes(q)||(c.span||"").toLowerCase().includes(q))) return;
    if(c.step_id!==lastStep){ lastStep=c.step_id;
      const h=document.createElement("div"); h.className="step-head"; h.textContent="Step "+c.step_id; list.appendChild(h);
    }
    const it=document.createElement("div");
    it.className="claim-item"+(c.claim_id===curId?" active":"");
    it.innerHTML=`<span class="dot ${st}"></span><div class="claim-meta">
      <div class="claim-id">${esc(c.claim_id)} <span class="badge t-${c.type}">${shortType(c.type)}</span></div>
      <div class="claim-span">${esc(c.span)}</div></div>`;
    it.onclick=()=>selectClaim(c.claim_id);
    list.appendChild(it);
  });
  updateProgress();
}
function shortType(t){return {action_intention:"intent",action_completion:"completed",observation:"observe",constraint_or_policy:"policy"}[t]||t;}
function updateProgress(){
  const done=claims.filter(c=>statusOf(c.claim_id)).length, tot=claims.length;
  $("#progText").textContent=done+" / "+tot;
  $("#progBar").style.width=(tot?Math.round(done/tot*100):0)+"%";
}

/* ---------------- main claim card ---------------- */
function selectClaim(id){
  if(!id) return; curId=id;
  const c=claims.find(x=>x.claim_id===id); if(!c) return;
  buildNav();
  const a=ann[id]||{};
  const card=$("#claimCard");
  card.innerHTML=`
    <div class="claim-head">
      <span class="badge t-${c.type}">${c.type}</span>
      <span class="claim-id">${esc(c.claim_id)}</span>
    </div>
    <div class="span-quote">“${esc(c.span)}”</div>
    <div class="scope-line">step <code>${c.step_id}</code> · validation_scope <code>${esc(c.validation_scope)}</code>
       · routed to ${(c.routed_channels||[]).map(x=>`<code>${x}</code>`).join(" + ")}</div>

    <div class="section"><h3>Evidence the judge sees <span class="hint">(routed by claim type · windowed by scope)</span></h3>
      <div id="evBox"></div></div>

    <div class="section"><h3>Your verdict <span class="hint">keys 1 / 2 / 3</span></h3>
      <div class="verdict-row" id="verdictRow">
        ${VERDICTS.map((v,i)=>`<button class="verdict-btn ${v} ${a.verdict===v?'sel':''}" data-v="${v}">
            ${v.replace(/_/g,' ')}<span class="k">${i+1}</span></button>`).join("")}
      </div>

      <div class="field"><label>Evidence pointer</label>
        <div class="pointer-grid">
          <select id="epChannel">
            <option value="">channel…</option>
            ${CHANNELS.map(ch=>`<option value="${ch}" ${a.evidence_pointer&&a.evidence_pointer.channel===ch?'selected':''}>${ch}</option>`).join("")}
          </select>
          <input id="epStep" type="number" placeholder="step" value="${a.evidence_pointer&&a.evidence_pointer.step!=null?a.evidence_pointer.step:''}">
          <input id="epRef" placeholder="deciding field / value / policy id" value="${esc(a.evidence_pointer&&a.evidence_pointer.ref||'')}">
        </div>
      </div>

      <div class="field"><label>Reason <span class="hint" style="text-transform:none">— ≤ 2 sentences, cite the field/value/text (no paraphrase)</span></label>
        <textarea id="reason" placeholder="e.g. Step 1 search_customers returned id=13 name=&quot;Fujita Kenji&quot;…">${esc(a.reason||'')}</textarea>
      </div>

      <div class="field"><label>Notes <span class="hint" style="text-transform:none">— optional flags</span></label>
        <textarea id="notes" placeholder="routing miss, weak evidence, suspected mis-typing…">${esc(a.notes||'')}</textarea>
        <div class="tags" id="tagRow">${QUICK_TAGS.map(t=>`<button data-tag="${t}">+ ${t}</button>`).join("")}</div>
      </div>

      <div class="formnav">
        <button class="btn" id="btnPrev">← Prev (k)</button>
        <button class="btn primary" id="btnNext">Save &amp; Next (j) →</button>
      </div>
    </div>`;

  renderEvidence(c);
  // wire form
  $$("#verdictRow .verdict-btn").forEach(b=>b.onclick=()=>setVerdict(id,b.dataset.v));
  ["epChannel","epStep","epRef","reason","notes"].forEach(fid=>{
    const el=$("#"+fid); el.addEventListener("input",()=>commit(id));
    el.addEventListener("change",()=>commit(id));
  });
  $$("#tagRow button").forEach(b=>b.onclick=()=>{ const n=$("#notes");
    const v=b.dataset.tag; n.value=(n.value.trim()?n.value.trim()+" ":"")+v; commit(id); });
  $("#btnPrev").onclick=()=>move(-1);
  $("#btnNext").onclick=()=>{ commit(id); move(1); };

  // sync context to this claim's step
  renderTrajectory(c.step_id);
  if(curTab!=="trajectory") {} else scrollTrajTo(c.step_id);
}

function setVerdict(id,v){
  const a=ann[id]||(ann[id]={}); a.verdict=v;
  // sensible default channel from the claim's first routed channel
  const c=claims.find(x=>x.claim_id===id);
  if(v==="needs_broader_context"){ a.evidence_pointer={channel:"",step:null,ref:""}; }
  else if(!a.evidence_pointer || !a.evidence_pointer.channel){
    a.evidence_pointer={channel:(c.routed_channels&&c.routed_channels[0])||"",step:c.step_id,ref:a.evidence_pointer&&a.evidence_pointer.ref||""};
  }
  save(); selectClaim(id);
}
function commit(id){
  const a=ann[id]||(ann[id]={});
  const ch=$("#epChannel").value, stp=$("#epStep").value, ref=$("#epRef").value;
  a.evidence_pointer={channel:ch||"", step:stp===""?null:Number(stp), ref:ref||""};
  a.reason=$("#reason").value; a.notes=$("#notes").value;
  save();
  // update dot without full re-render
  $$(".claim-item").forEach(()=>{});
}
function move(d){
  const idx=claims.findIndex(c=>c.claim_id===curId);
  const n=idx+d; if(n>=0&&n<claims.length) selectClaim(claims[n].claim_id);
}

/* ---------------- evidence panel ---------------- */
function renderEvidence(c){
  const box=$("#evBox"); box.innerHTML="";
  const terms=keyTerms(c.span);
  (c.routed_channels||[]).forEach(ch=>{
    const sec=document.createElement("div"); sec.className="ev-channel";
    const title=document.createElement("div"); title.className="ev-title"; title.textContent=ch; sec.appendChild(title);
    if(ch==="tool_calls"){
      const items=(B.steps||[]).flatMap(s=>(s.tool_calls||[]).map(t=>({...t,step_id:s.step_id})))
                  .filter(t=>inScope(t.step_id,c.step_id,c.validation_scope));
      if(!items.length) sec.appendChild(emptyEv());
      items.forEach(t=>sec.appendChild(callCard(t,null,terms)));
    } else if(ch==="tool_results"){
      const items=(B.steps||[]).flatMap(s=>(s.tool_results||[]).map(t=>({...t,step_id:s.step_id})))
                  .filter(t=>inScope(t.step_id,c.step_id,c.validation_scope));
      if(!items.length) sec.appendChild(emptyEv());
      items.forEach(t=>sec.appendChild(callCard(t,t.result,terms)));
    } else if(ch==="audit"){
      const items=(B.audit||[]).filter(t=>inScope(t.step_id,c.step_id,c.validation_scope))
                  .filter(t=>t.claim_pre!=null||t.claim_post!=null);
      if(!items.length){ const e=emptyEv(); e.textContent="No state deltas (claim_pre/claim_post) in window."; sec.appendChild(e); }
      items.forEach(t=>{ const cc=document.createElement("div"); cc.className="callcard";
        cc.innerHTML=`<div class="ch">step ${t.step_id} · ${esc(t.tool_name)} · ${esc(t.action_id||'')}</div>`;
        cc.appendChild(renderJSON({claim_pre:t.claim_pre,claim_post:t.claim_post},terms)); sec.appendChild(cc); });
    } else if(ch==="codebook"){
      sec.appendChild(scrollMd(B.codebook,"Search policy…"));
    } else if(ch==="tool_registry"){
      sec.appendChild(scrollMd(B.tool_registry||"(tool registry not bundled)","Search tool…"));
    }
    box.appendChild(sec);
  });
}
function emptyEv(){ const d=document.createElement("div"); d.className="ev-empty"; d.textContent="(routed channel is empty in this window — candidate for needs_broader_context)"; return d; }
function callCard(call,result,terms){
  const cc=document.createElement("div"); cc.className="callcard";
  cc.innerHTML=`<div class="ch">step ${call.step_id} · ${esc(call.call_id||'')}</div>
                <div class="sig">${esc(sig(call))}</div>`;
  if(result!==null&&result!==undefined){
    const t=document.createElement("button"); t.className="result-toggle"; t.textContent="▸ show result";
    const holder=document.createElement("div"); holder.className="hidden";
    let built=false;
    t.onclick=()=>{ if(!built){holder.appendChild(renderJSON(result,terms));built=true;}
      holder.classList.toggle("hidden"); t.textContent=holder.classList.contains("hidden")?"▸ show result":"▾ hide result"; };
    cc.appendChild(t); cc.appendChild(holder);
  }
  return cc;
}
function scrollMd(md,placeholder){
  const wrap=document.createElement("div");
  const s=document.createElement("input"); s.className="ctx-search"; s.placeholder=placeholder||"Search…";
  const body=document.createElement("div"); body.className="md jsonbox"; body.style.maxHeight="340px"; body.style.fontFamily="var(--sans)";
  body.innerHTML=mdToHtml(md);
  s.addEventListener("input",()=>{ const q=s.value.toLowerCase();
    $$("p,li,td,h2,h3",body).forEach(el=>{ el.style.background = q&&el.textContent.toLowerCase().includes(q)?"#fff3bf":""; });
  });
  wrap.appendChild(s); wrap.appendChild(body); return wrap;
}
function keyTerms(span){
  if(!span) return [];
  const m=span.match(/[A-Za-z]{4,}|\d[\d,.]{2,}|\bID:\s*\d+\b|"[^"]+"|S-\d+|G-\d+/g)||[];
  return [...new Set(m.map(s=>s.replace(/[":]/g,"").trim()).filter(s=>s.length>=3))].slice(0,10);
}

/* ---------------- context tabs ---------------- */
let curTab="trajectory";
function switchTab(tab){
  curTab=tab; $$("#ctxTabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="trajectory"){ const c=claims.find(x=>x.claim_id===curId); renderTrajectory(c?c.step_id:null); }
  else if(tab==="audit") renderAudit();
  else if(tab==="codebook"){ $("#ctxBody").innerHTML=""; $("#ctxBody").appendChild(scrollMdFull(B.codebook,"Search codebook…")); }
  else if(tab==="registry"){ $("#ctxBody").innerHTML=""; $("#ctxBody").appendChild(scrollMdFull(B.tool_registry||"(not bundled)","Search tools…")); }
}
function scrollMdFull(md,ph){ const w=document.createElement("div");
  const s=document.createElement("input"); s.className="ctx-search"; s.placeholder=ph;
  const b=document.createElement("div"); b.className="md"; b.innerHTML=mdToHtml(md);
  s.addEventListener("input",()=>{const q=s.value.toLowerCase();
    $$("p,li,td,h2,h3",b).forEach(el=>el.style.background=q&&el.textContent.toLowerCase().includes(q)?"#fff3bf":"");});
  w.appendChild(s);w.appendChild(b);return w;
}
function renderTrajectory(curStep){
  const body=$("#ctxBody"); body.innerHTML="";
  (B.steps||[]).forEach(s=>{
    const d=document.createElement("div"); d.className="traj-step"+(s.step_id===curStep?" cur":"");
    d.id="traj-step-"+s.step_id;
    let inner=`<div class="sh">Step ${s.step_id}</div><div class="sb">`;
    if(s.assistant_text) inner+=`<div class="atext">${esc(s.assistant_text)}</div>`;
    (s.tool_calls||[]).forEach(t=>inner+=`<div class="tiny">→ ${esc(sig(t))}</div>`);
    d.innerHTML=inner+"</div>";
    (s.tool_results||[]).forEach(t=>{
      const sb=d.querySelector(".sb");
      const tb=document.createElement("button"); tb.className="result-toggle"; tb.textContent="▸ result: "+t.tool_name;
      const h=document.createElement("div"); h.className="hidden"; let built=false;
      tb.onclick=()=>{ if(!built){h.appendChild(renderJSON(t.result,[]));built=true;} h.classList.toggle("hidden");
        tb.textContent=(h.classList.contains("hidden")?"▸":"▾")+" result: "+t.tool_name; };
      sb.appendChild(tb); sb.appendChild(h);
    });
    body.appendChild(d);
  });
  scrollTrajTo(curStep);
}
function scrollTrajTo(step){ const el=$("#traj-step-"+step); if(el&&curTab==="trajectory") el.scrollIntoView({block:"nearest"}); }
function renderAudit(){
  const body=$("#ctxBody"); body.innerHTML="";
  const recs=(B.audit||[]);
  if(!recs.length){ body.innerHTML='<p class="tiny">No audit records bundled.</p>'; return; }
  recs.forEach(r=>{ const d=document.createElement("div"); d.className="traj-step";
    d.innerHTML=`<div class="sh">step ${r.step_id} · ${esc(r.tool_name)} · ${esc(r.action_id||'')}</div>`;
    const sb=document.createElement("div"); sb.className="sb";
    const hasDelta=r.claim_pre!=null||r.claim_post!=null;
    if(hasDelta) sb.appendChild(renderJSON({claim_pre:r.claim_pre,claim_post:r.claim_post},[]));
    else sb.innerHTML='<span class="tiny">no state delta</span>';
    d.appendChild(sb); body.appendChild(d);
  });
}

/* ---------------- export / import ---------------- */
function buildGold(){
  const verdicts=claims.filter(c=>ann[c.claim_id]&&ann[c.claim_id].verdict).map(c=>{
    const a=ann[c.claim_id];
    return {claim_id:c.claim_id, verdict:a.verdict,
      evidence_pointer:a.verdict==="needs_broader_context"?null:(a.evidence_pointer||null),
      reason:a.reason||"", notes:a.notes||""};
  });
  return {task_id:B.task_id, trajectory_file:B.trajectory_file,
    annotator:$("#annotName").value.trim()||"anonymous",
    schema_version:"stage2_verdict_v1", verdicts};
}
function exportGold(){
  const gold=buildGold();
  const done=gold.verdicts.length, tot=claims.length;
  if(done<tot && !confirm(`Only ${done}/${tot} claims annotated. Export anyway?`)) return;
  const blob=new Blob([JSON.stringify(gold,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(B.task_id||"stage2")+"_gold.json"; a.click();
}
function importGold(obj){
  if(!obj||!obj.verdicts){ alert("Not a valid gold file (missing .verdicts)."); return; }
  obj.verdicts.forEach(v=>{ ann[v.claim_id]={verdict:v.verdict,
    evidence_pointer:v.evidence_pointer||{channel:"",step:null,ref:""}, reason:v.reason||"", notes:v.notes||""}; });
  if(obj.annotator){ ann.__meta__=ann.__meta__||{}; ann.__meta__.annotator=obj.annotator; $("#annotName").value=obj.annotator; }
  save(); buildNav(); selectClaim(curId);
  alert("Imported "+obj.verdicts.length+" verdicts.");
}

/* ---------------- global bindings ---------------- */
function bindGlobal(){
  $("#navSearch").addEventListener("input",buildNav);
  $$("#navFilters button").forEach(b=>b.onclick=()=>{ filter=b.dataset.f;
    $$("#navFilters button").forEach(x=>x.classList.toggle("on",x===b)); buildNav(); });
  $$("#ctxTabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  $("#annotName").addEventListener("input",save);
  $("#btnExport").onclick=exportGold;
  $("#btnImport").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{try{importGold(JSON.parse(r.result));}catch(err){alert("Parse error: "+err);} }; r.readAsText(f); };
  $("#btnGuide").onclick=()=>showModal("Annotation Guideline", mdToHtml(B.guideline||"(guideline not bundled)"));
  $("#btnHelp").onclick=()=>showModal("Keyboard shortcuts",
    `<p><span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> — supported / not&nbsp;supported / needs&nbsp;broader&nbsp;context</p>
     <p><span class="kbd">j</span> or <span class="kbd">→</span> — save &amp; next claim &nbsp;·&nbsp; <span class="kbd">k</span> or <span class="kbd">←</span> — previous claim</p>
     <p><span class="kbd">g</span> — open guideline &nbsp;·&nbsp; <span class="kbd">/</span> — focus search</p>
     <p>Work autosaves to this browser. <b>Export gold</b> downloads the JSON to send back.</p>`);
  document.addEventListener("keydown",e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      if(e.key==="Escape") document.activeElement.blur(); return; }
    if(e.key==="1") setVerdict(curId,"supported");
    else if(e.key==="2") setVerdict(curId,"not_supported");
    else if(e.key==="3") setVerdict(curId,"needs_broader_context");
    else if(e.key==="j"||e.key==="ArrowRight") move(1);
    else if(e.key==="k"||e.key==="ArrowLeft") move(-1);
    else if(e.key==="g") $("#btnGuide").click();
    else if(e.key==="/"){ e.preventDefault(); $("#navSearch").focus(); }
  });
}
function showModal(title,html){
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="modal"><h2>${esc(title)}</h2><div class="md">${html}</div>
    <p style="text-align:right;margin-top:14px"><button class="btn">Close</button></p></div>`;
  o.onclick=e=>{ if(e.target===o||e.target.tagName==="BUTTON") o.remove(); };
  document.body.appendChild(o);
}

/* ---------------- loader / file drop ---------------- */
function tryFile(file){ const r=new FileReader(); r.onload=()=>{ try{ boot(JSON.parse(r.result)); }catch(e){ alert("Could not parse bundle: "+e); } }; r.readAsText(file); }
$("#filepick").onchange=e=>{ if(e.target.files[0]) tryFile(e.target.files[0]); };
const drop=$("#drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor="#4f46e5";}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor="#c9cdd8";}));
drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) tryFile(f); });

if(window.__BUNDLE__) boot(window.__BUNDLE__);
</script>
</body>
</html>
