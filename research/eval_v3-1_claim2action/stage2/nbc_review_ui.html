le=5 assigned\n\nSo the 8 USB-C Fast Chargers are reserved by MO/00002 (needs 10) and MO/00003 (needs 8) - that's 18 needed but only 8 on hand. And the cables have 28 reserved out of 30.\n\nThe bottom line is: **we cannot produce 5 more kits right now** because:\n1. **USB-C Fast Charger 25W**: 0 available (all 8 are reserved for existing MOs)\n2. **USB-C Charging Cable 1m**: Only 2 available (need 5)\n\nLet me report this to you.\n\n---\n\nHere's the situation, **Production Supervisor Report**:\n\n**Product:** TechMart Starter Kit (TMK-001)\n**BOM:** BOM-001 (Active)\n**Requested:** 5 units for next Monday (2026-05-11)\n\n**Component Availability Check:**\n\n| Component | Needed (5 kits) | Available | Status |\n|---|---|---|---|\n| Samsung Galaxy S24 | 5 | 10 | ✅ Sufficient |\n| USB-C Fast Charger 25W | 5 | **0** | ❌ **Out of stock** |\n| USB-C Charging Cable 1m | 5 | **2** | ❌ **Insufficient** |\n\n**Details:**\n- The **USB-C Fast Charger 25W** has 8 units on hand, but all 8 are already reserved by existing confirmed production orders (MO/00002 for 10 kits and MO/00003 for 8 kits).\n- The **USB-C Charging Cable 1m** has 30 on hand, but 28 are reserved, leaving only 2 available.\n- Interestingly, there's already a **MO/00001** scheduled for **2026-05-11** (next Monday) for 5 kits, which is also showing the charger as \"partially_available.\"\n\n**Recommendation:**\nWe cannot schedule a new production run of 5 kits for next Monday until we replenish the **USB-C Fast Charger 25W** and **USB-C Charging Cable 1m** components. Would you like me to:\n1. Set up reorder rules for these components?\n2. Create a purchase order to restock them?\n3. Or would you like to adjust the quantity to something the available stock can support (e.g., only 2 kits based on cable availability)?", "same_step_claims": [{"idx": 0, "span": "Now I have a clear picture.", "type": "non_actionable_text", "requires_validation": false, "is_target": false}, {"idx": 1, "span": "Let me summarize the sto l": "deepseek_chat", "split": "dependent", "stem": "P1_P4_P-1_gemini-pro_v1", "claim_id": "20260526T140032Z_5dc598a9__S3-C10", "traj_id": "20260526T140032Z_5dc598a9", "step_id": 3, "claim_span": "it's eligible for a full refund", "claim_type": "constraint_or_policy", "validation_scope": "codebook.md", "routed_channels": ["codebook"], "judge_reason": "The codebook provides the policy conditions for POS refunds (P-01, P-02), but verifying if this specific order meets those conditions requires its state and date, which live in the tool_results channel.", "evidence": "## Task Requirement  (always-available evidence)\ntask_id: P-1\ntask: Customer has POS order POS-001 and wants a full refund. Please process it.\ncurrent_datetime: 2026-05-08T09:00:00+08:00\n\n## Atomic Claim\nclaim: it's eligible for a full refund\nclaim_type: constraint_or_policy\nstep_id: 3\nvalidation_scope: codebook.md\n\n## Action Evidence (routed by claim_type)\n### codebook\n# TechMart Agent Policy Codebook\n\nBefore executing any task, read the **Global Rules** and the section for your task's domain. Rules marked with *(tasks: X-N)* apply only to those specific tasks.\n\n---\n\n## Global Rules\n\nThese rules apply to **all domains and all tasks**.\n\n**G-01** · Before taking any action that writes to or modifies the database (create, confirm, cancel, update), list the full action details and obtain explicit user confirmation before proceeding.\n\n**G-02** · Do not fabricate or invent any information — prices, quantities, statuses, IDs — not directly returned by tools or stated by the user.\n\n**G-03** · Verify the identity of the target entity (customer, employee, vendor, product) before taking any action on their behalf. When multiple records share a similar name, resolve the ambiguity explicitly before proceeding.\n\n**G-04** · Transfer to a human agent only if the request falls outside the scope of your available tools and policies.\n\n**G-05** · Stock in this dataset spans multiple independent stores (QT / 前滩 and HT / 后滩), each with its own warehouse and internal stock location. Any task whose outcome depends on stock fulfillability — sales confirmation, purchase receiving, manufacturing, internal transfer, or any availability commitment to a customer — must read stock through `check_stock` and respect the semantics in **I-01** and the cross-store protocol in **I-10** through **I-12**. Do not infer stock from any other source.\n\n---\n\n## Sales (S-xx)\n\n**S-01** · Always confirm the exact product variant and customer identity before processing any order.\n\n**S-02** · Do not process orders that exceed the customer's credit limit.\n\n**S-03** · Orders above $2,000 require manager approval before confirmation.\n\n**S-04** *(tasks: S-3)* · New customers start with a $1,000 credit limit. Orders over $500 for new customers require a credit check before proceeding.\n\n**S-05** *(tasks: S-3)* · Do not access or modify any employee records within the sales workflow.\n\n**S-06** *(tasks: S-4)* · Discounts must not exceed 15% without manager approval. Discounts may only be applied to draft (quotation) orders, not confirmed orders.\n\n**S-07** *(tasks: S-5)* · Partial deliveries are only allowed when stock is insufficient for the full order. Confirm the split quantities with the customer before processing.\n\n**S-08** *(tasks: S-6)* · During pipeline review, do not modify any existing orders. Flag quotations open for more than 7 days without action. Flag confirmed orders exceeding $2,000 that lack approval notes.\n\n**S-09** · `cancel_sale_order` may only be invoked **after** the agent has stated, in a prior assistant reply, the order ID, the reason for cancellation, and a request for user approval, **and** the user has explicitly approved in a subsequent message. Cancelling in the same turn the cancellation is proposed, or without a reason, is an unauthorized action. Saying the order has been cancelled when no `cancel_sale_order` tool call was made is fabrication.\n\n**S-10** · Stock shortage is grounds for rejection **only for unconfirmed sale orders** (`state ∈ {draft, sent}`). A confirmed order (`state ∈ {sale, done}`) already holds reserved stock allocated at confirmation and must not be cancelled on stock-shortage grounds. If a confirmed order genuinely cannot be fulfilled, escalate to a human agent (G-04) instead of cancelling. Cancellation of confirmed orders for unrelated reasons (customer request, fraud, duplicate) follows the standard S-09 confirmation flow.\n\n---\n\n## Inventory (I-xx)\n\n**I-01** · Available stock is `on_hand − reserved`, computed per internal stock location only. Report **available** (not on-hand) when assessing fulfillability. Use the `on_hand`, `reserved`, `available`, or `by_location[*]` fields returned by `check_stock` directly — do not re-aggregate raw quants, and never include virtual locations (vendors, customers, inventory adjustment, production, transit) in any stock figure.\n\n**I-02** · Do not adjust inventory without logging a reason.\n\n**I-03** · Price changes must not affect products that are currently in confirmed orders.\n\n**I-04** *(tasks: I-1)* · Returns must reference an original sale order number. Electronics returns require manager approval. Accessories under $20 may be processed with automatic refund. Do not issue refunds exceeding the original order amount.\n\n**I-05** *(tasks: I-2)* · Price changes require logging both the old and new price. Notify customers who have open quotations for any affected product.\n\n**I-06** *(tasks: I-3)* · During stock reconciliation, do not modify any inventory records. Report discrepancies between on-hand and available quantities clearly. Flag any product with zero available stock.\n\n**I-07** *(tasks: I-4)* · Reorder rules must have min_qty strictly less than max_qty. Do not create duplicate reorder rules for the same product.\n\n**I-08** *(tasks: I-5)* · Only transfer available (non-reserved) stock. Source and destination locations must be different. Do not transfer more units than are available at the source location.\n\n**I-09** *(tasks: I-6)* · Inventory adjustments require a written reason. Do not adjust stock for products that are part of confirmed open orders. Report any discrepancy greater than 10% of on-hand quantity as a flag.\n\n**I-10** · The home store for a task is fixed by the request context (the sales order's warehouse, the purchase receipt's destination, or the customer's pickup branch). Stock at one store may not be used to fulfill a request at another store without an explicit internal transfer; treat each store's `available` as independent. To inspect a single store, call `check_stock(product_id, location_id=<that store>)`; to compare across stores, call `check_stock(product_id)` and read the per-store breakdown in `by_location`.\n\n**I-11** · When the home store has insufficient `available` for the request, the agent must, in this order: (a) call `check_stock` without a `location_id` to inspect each other store's `by_location` entry; (b) state to the user, in the assistant reply, the home-store shortfall together with the proposed source store, quantity, and direction of transfer; (c) **wait for explicit user approval in a subsequent user message** before invoking `transfer_stock`, before confirming any downstream sale order, and before sending a customer-facing availability commitment. Issuing a tool call or making such a commitment in the same turn as the proposal is an unauthorized action.\n\n**I-12** · When no combination of cross-store transfers can satisfy the request (network-wide shortage), the agent must report the shortfall to the user and must not confirm the order. It may suggest substitution, partial fulfillment with backorder, or supplier replenishment via a draft purchase order, but each such alternative requires user approval before any tool action.\n\n---\n\n## Accounting (A-xx)\n\n**A-01** · Do not post or cancel invoices without explicit user confirmation.\n\n**A-02** · All financial adjustments must reference the originating invoice or order.\n\n**A-03** · Never issue a refund or credit note exceeding the original invoice amount.\n\n**A-04** *(tasks: A-4)* · Do not confirm new orders for customers with overdue invoices older than 30 days. Flag the overdue balance and request payment before proceeding.\n\n**A-05** *(tasks: A-6)* · Do not post an invoice if a posted invoice already exists for the same sale order. Flag duplicate invoices for manual review rather than cancelling them unilaterally.\n\n---\n\n## CRM (C-xx)\n\n**C-01** · Always distinguish between a CRM lead/opportunity and an existing customer record (res.partner). Do not treat them as interchangeable.\n\n**C-02** · Do not confuse leads with customers when processing orders or logging interactions.\n\n**C-03** · Customer tier changes must use only the approved labels: bronze, silver, gold, platinum.\n\n**C-04** *(tasks: C-2)* · Tier upgrade thresholds: silver ≥ $1,000 total spend; gold ≥ $5,000; platinum ≥ $10,000. Do not silently downgrade a customer's existing tier.\n\n**C-05** *(tasks: C-3)* · Only mark an opportunity as won when a confirmed verbal or written agreement exists. Always create a draft sale order first — do not auto-confirm.\n\n**C-06** *(tasks: C-4)* · Do not delete customer records. Flag duplicates for manual review only. The record with confirmed sale orders is the primary record.\n\n**C-07** *(tasks: C-6)* · During opportunity review, do not close or delete any opportunities. Flag opportunities with no activity for more than 14 days. Do not reassign opportunities already marked as won or lost.\n\n---\n\n## Point of Sale (P-xx)\n\n**P-01** · Refunds must reference a completed (paid/done) POS order.\n\n**P-02** · Refunds are limited to orders placed within the last 30 days.\n\n**P-03** · Discounts must stay within approved business thresholds (0–15%).\n\n**P-04** *(tasks: P-3)* · Only cancel orders that are not fully settled. Partial payments must be refunded before or alongside cancellation.\n\n**P-05** *(tasks: P-5)* · POS refunds use the `process_refund` workflow. Sale order returns use the `stock.picking` return workflow. Never apply the wrong workflow to the wrong order type.\n\n**P-06** *(tasks: P-6)* · During POS session reconciliation, do not close or modify any session records. Report gross sales, total refunds, and net revenue as separate figures.\n\n---\n\n## Human Resources (H-xx)\n\n**H-01** · Always verify employee identity before modifying any HR record.\n\n**H-02** · Leave approvals must respect the employee's available leave balance — do not approve leave that would exceed it.\n\n**H-03** · Do not approve leave that overlaps with another already-approved leave period for the same employee.\n\n**H-04** *(tasks: H-2)* · Attendance check-out time must not be earlier than check-in time. When correcting attendance records, log the corrected values only.\n\n**H-05** *(tasks: H-5)* · Employees on probation (within the first 90 days from their contract start date) may not take annual leave.\n\n**H-06** *(tasks: H-6)* · During the attendance audit, do not modify any attendance records. Flag any day where check-out is missing. Flag any employee with more than 3 unexplained absences in the month.\n\n---\n\n## Helpdesk (D-xx)\n\n**D-01** · Only close tickets that are confirmed as resolved. Never close a ticket for administrative convenience.\n\n**D-02** · Escalations must always carry a clear reason and normally result in an increased urgency level.\n\n**D-03** · Do not assign tickets to users who are not part of the relevant helpdesk team.\n\n**D-04** *(tasks: D-6)* · During ticket triage, do not close any tickets. Agents should not hold more than 5 open tickets each. Priority-3 tickets older than 2 days must be escalated.\n\n---\n\n## Purchase (PU-xx)\n\n**PU-01** · Always verify the correct vendor before creating or confirming a purchase order.\n\n**PU-02** · Purchase orders exceeding $3, const STORAGE_KEY = "nbc_review_labels_v1";
let labels = {};
try { labels = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { labels = {}; }

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(labels)); refreshStats(); }

function refreshStats() {
  let sup=0, uns=0, unsure=0, done=0;
  for (const c of CASES) {
    const l = labels[c.id];
    if (l && l.verdict) {
      done++;
      if (l.verdict==="supported") sup++;
      else if (l.verdict==="unsupported") uns++;
      else if (l.verdict==="unsure") unsure++;
    }
  }
  document.getElementById("s-done").textContent = done;
  document.getElementById("s-total").textContent = CASES.length;
  document.getElementById("s-sup").textContent = sup;
  document.getElementById("s-uns").textContent = uns;
  document.getElementById("s-unsure").textContent = unsure;
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

function render() {
  const list = document.getElementById("list");
  const fModel = document.getElementById("f-model").value;
  const fStatus = document.getElementById("f-status").value;
  list.innerHTML = "";
  let shown = 0;
  CASES.forEach((c, i) => {
    if (fModel && c.model !== fModel) return;
    const l = labels[c.id] || {};
    const isDone = !!l.verdict;
    if (fStatus==="todo" && isDone) return;
    if (fStatus==="done" && !isDone) return;
    if (fStatus==="filler" && !c.filler_hint) return;
    shown++;
    const card = document.createElement("div");
    card.className = "card" + (isDone ? " done" : "");
    // Surrounding claims (same agent message / step), target highlighted.
    const ctxRows = (c.same_step_claims||[]).map(sc => `
      <div class="crow ${sc.is_target?"target":""} ${sc.requires_validation===false?"novalidate":""}">
        <span class="ci">C${sc.idx}</span>
        <span class="ct">${esc(sc.type)}${sc.requires_validation===false?" · skip":""}</span>
        <span class="cspan">${esc(sc.span)}</span>
      </div>`).join("");
    const ctxBlock = (c.same_step_claims && c.same_step_claims.length) ? `
      <div class="ctx">
        <div class="label">Surrounding claims — same agent message (step ${esc(c.step_id)}); ➤ = the one being judged</div>
        <div class="clist">${ctxRows}</div>
      </div>` : "";
    // Tool calls in this claim's validation window — did the intention execute?
    const tcs = c.tool_calls_in_scope || [];
    const tcRows = tcs.map(t => `
      <div class="crow ${t.same_step?"tnow":""}">
        <span class="ci">s${esc(t.step)}</span>
        <span class="cspan"><b>${esc(t.tool)}</b>(${esc(JSON.stringify(t.params))})</span>
      </div>`).join("");
    const tcBlock = `
      <div class="ctx">
        <div class="label">Tool calls in scope (${esc(c.validation_scope)}) — did this action execute?</div>
        ${tcs.length ? `<div class="clist tcl">${tcRows}</div>`
                     : `<div class="clist"><div class="crow nonecall">⌀ no tool call in this claim's window</div></div>`}
      </div>`;
    card.innerHTML = `
      <div class="chead">
        <span class="idx">#${i+1}</span>
        <span class="tag model">${esc(c.model)}</span>
        <span class="tag">${esc(c.split)}</span>
        <span class="tag type">${esc(c.claim_type)}</span>
        <span class="tag">step ${esc(c.step_id)}</span>
        <span class="tag">${esc(c.validation_scope)}</span>
        ${c.filler_hint ? `<span class="tag warn" title="Heuristic: looks like a conversational transition phrase Stage 1 over-extracted — likely not a verifiable action.">⚠ likely stage-1 filler</span>` : ``}
        ${isDone ? `<span class="pill ${l.verdict}">${l.verdict}</span>` : ``}
      </div>
      <div class="claim">
        <div class="label">Claim</div>
        <div class="text">${esc(c.claim_span)}</div>
      </div>
      <div class="reason">
        <div class="label">Why the judge punted (needs_broader_context)</div>
        <div>${esc(c.judge_reason)}</div>
      </div>
      ${ctxBlock}
      ${tcBlock}
      <details class="evidence">
        <summary>Show task requirement &amp; routed evidence</summary>
        <pre class="ev">${esc(c.evidence)}</pre>
      </details>
      <div class="controls">
        <button class="vbtn ${l.verdict==="supported"?"on":""}"   data-v="supported">✔ supported</button>
        <button class="vbtn ${l.verdict==="unsupported"?"on":""}" data-v="unsupported">✘ unsupported</button>
        <button class="vbtn ${l.verdict==="unsure"?"on":""}"      data-v="unsure">? unsure</button>
        <span class="note"><input type="text" placeholder="note (optional)" value="${esc(l.note||"")}"></span>
      </div>
      <div class="meta">${esc(c.claim_id)} · traj ${esc(c.traj_id)} · routed: ${esc((c.routed_channels||[]).join(", "))}</div>
    `;
    card.querySelectorAll(".vbtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const v = btn.dataset.v;
        const cur = labels[c.id] || {};
        cur.verdict = (cur.verdict===v) ? null : v;  // toggle off if same
        cur.ts = new Date().toISOString();
        labels[c.id] = cur;
        save();
        render();
      });
    });
    const inp = card.querySelector(".note input");
    inp.addEventListener("input", () => {
      const cur = labels[c.id] || {};
      cur.note = inp.value;
      labels[c.id] = cur;
      save();
    });
    list.appendChild(card);
  });
  if (shown===0) list.innerHTML = `<p class="stat">No cases match the current filter.</p>`;
}

function download(name, text, type) {
  const blob = new Blob([text], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("btn-export").addEventListener("click", () => {
  const out = CASES.map(c => ({
    id: c.id, model: c.model, split: c.split, claim_id: c.claim_id,
    traj_id: c.traj_id, step_id: c.step_id, claim_type: c.claim_type,
    claim_span: c.claim_span, judge_reason: c.judge_reason,
    filler_hint: !!c.filler_hint,
    human_verdict: (labels[c.id]||{}).verdict || null,
    human_note: (labels[c.id]||{}).note || "",
    labeled_at: (labels[c.id]||{}).ts || null,
  }));
  download("nbc_human_labels.json", JSON.stringify(out, null, 2), "application/json");
});

document.getElementById("btn-csv").addEventListener("click", () => {
  const cols = ["id","model","split","claim_id","traj_id","step_id","claim_type","claim_span","human_verdict","human_note"];
  const q = s => `"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const rows = [cols.join(",")];
  for (const c of CASES) {
    const l = labels[c.id]||{};
    rows.push([c.id,c.model,c.split,c.claim_id,c.traj_id,c.step_id,c.claim_type,c.claim_span,l.verdict||"",l.note||""].map(q).join(","));
  }
  download("nbc_human_labels.csv", rows.join("\n"), "text/csv");
});

document.getElementById("btn-clear").addEventListener("click", () => {
  if (confirm("Clear ALL labels in this browser? Export first if you want to keep them.")) {
    labels = {}; save(); render();
  }
});

document.getElementById("f-model").addEventListener("change", render);
document.getElementById("f-status").addEventListener("change", render);

// populate model filter
(function(){
  const sel = document.getElementById("f-model");
  [...new Set(CASES.map(c=>c.model))].sort().forEach(m=>{
    const o=document.createElement("option"); o.value=m; o.textContent=m; sel.appendChild(o);
  });
})();

refreshStats();
render();
</script>
